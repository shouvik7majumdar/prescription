name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Compact Compiler
        run: |
          $HOME/.local/bin/compact update 0.5.1 || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Generated Contract Artifacts
        run: |
          test -f contracts/managed/prescription-verifier/contract/index.js
          test -f contracts/managed/prescription-verifier/contract/index.d.ts
          echo "✅ Managed contract artifacts verified successfully."

      - name: Run Contract & Unit Tests
        run: npx vitest run

      - name: Build Next.js Application
        run: npm run build
